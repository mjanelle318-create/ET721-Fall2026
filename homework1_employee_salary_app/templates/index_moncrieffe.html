
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Salary Increase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Employee Salary Increase</h1>

    <form method="POST" action="/">
        <label>Employee Name:</label>
        <input type="text" name="employee_name" maxlength="50" required>

        <label>Employee ID:</label>
        <input type="number" name="employee_id" min="0" max="99" required>

        <label>Employee Salary:</label>
        <input type="number" name="salary" min="0" max="999999" required>

        <button type="submit">Increase Salary</button>
    </form>

    {% if result %}
    <div class="result">
        <h2>Employee Salary Increase</h2>
        <p>Employee Name: {{ result.employee_name }}</p>
        <p>Employee ID: {{ result.employee_id }}</p>
        <p>Employee Salary: {{ result.salary }}</p>
        <p><strong>The increase salary is $ {{ "%.2f"|format(result.new_salary) }}</strong></p>
    </div>
    {% endif %}
</body>
</html>
